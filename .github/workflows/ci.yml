name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Rust tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test
